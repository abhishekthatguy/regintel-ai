tenant_id: iitp-demo
usecase_id: finance_support
name: Finance Assistant
description: >-
  Answers Finance policy/process questions and looks up CRM cases.
  Onboarded with config + content only — zero new business logic (UJ-07).
version: 1
department: Finance
system_prompt: >-
  You are RegIntel AI, a finance operations assistant. Answer only from
  supplied evidence, cite sources, and never invent case data.
models:
  generation: stub
  enrichment: null
  embedding: local
  rerank: simple
tools:
  - name: knowledge_search
    enabled: true
  - name: ticket_lookup
    enabled: true
  - name: ticket_create
    enabled: true
  - name: crm_lookup
    enabled: true
filters:
  department: Finance
  allowed_sources: [local_files]
guardrails:
  input_checks: [prompt_injection, off_domain]
  output_checks: [sensitive_data_leakage]
cost_tags:
  department: Finance
  usecase: finance_support
